# Nothing goes to /dev/console: the console is the screen the window server draws on, and a daemon's error line (gdnc: "Broken pipe" when an application quits) would be written over the desktop.
*.notice;authpriv.none;kern.debug;lpr.info;mail.crit;news.err	/var/log/messages
security.*					/var/log/security
auth.info;authpriv.info				/var/log/auth.log
cron.*						/var/log/cron
