# Silent boot: nothing of FreeBSD's own boot is shown (Ploader chains this loader without a menu; the first thing on the screen is the window server).
autoboot_delay="-1"
beastie_disable="YES"
loader_logo="none"
loader_menu_frame=""
boot_mute="YES"
boot_verbose="NO"
verbose_loading="NO"
kern.vty="vt"
vfs.root.mountfrom="cd9660:/dev/iso9660/PEAROS"
# the root is a live medium: memory file systems for what is written
tmpfs_load="YES"
nullfs_load="YES"
# USB keyboard and tablet through the HID drivers (evdev)
hw.usb.usbhid.enable="1"
hkbd_load="YES"
hms_load="YES"
hidmap_load="YES"
hmt_load="YES"
kern.cam.boot_delay="1000"
# 16:9 at 1080p when the firmware offers it (the EFI framebuffer is what the window server draws on)
efi_max_resolution="1080p"
# sound (the mixer of the Control Center and the volume keys need a device) and the ACPI backlight (the Display slider uses hw.acpi.video.lcd0.brightness when there is one)
snd_hda_load="YES"
snd_uaudio_load="YES"
acpi_video_load="YES"
# USB network adapters and phone tethering: iPhone Personal Hotspot over USB (ipheth, paired by usbmuxd), Android RNDIS tethering (urndis), CDC ethernet (cdce, ncm), common dongles
if_ipheth_load="YES"
if_urndis_load="YES"
if_cdce_load="YES"
if_ure_load="YES"
if_axe_load="YES"
if_axge_load="YES"
# Bluetooth controllers (the rc script wsbsd_bluetooth starts the stack on them) and 3G/4G modems
ng_ubt_load="YES"
u3g_load="YES"
# Intel MacBooks: the SMC (fans, temperatures, keyboard backlight, ambient light sensor), the USB trackpads of 2009-2015 models (wsp), the old Broadcom Wi-Fi (bwn, firmware from bwn-firmware-kmod), the gmux of the dual-GPU ones
asmc_load="YES"
wsp_load="YES"
if_bwn_pci_load="YES"
apple_gmux_load="YES"
coretemp_load="YES"
cpuctl_load="YES"
# Laptop touchpads and keyboards on I2C (ELAN, Synaptics, Goodix, ... as HID over I2C: the touchpad of the Clevo NS50/NS70 and most laptops since ~2016): the Intel I2C controller (ig4), the bus, the ACPI
# enumeration, the I2C-HID transport (iichid) with the GPIO pins its interrupts come from, and the HID parts that sit on it. Without these the touchpad does not exist (only a USB or PS/2 one would)
ig4_load="YES"
iicbus_load="YES"
iic_load="YES"
acpi_iicbus_load="YES"
iichid_load="YES"
gpiobus_load="YES"
intelgpio_load="YES"
hidbus_load="YES"
hconf_load="YES"
hcons_load="YES"
hsctrl_load="YES"
hpen_load="YES"
hgame_load="YES"
# AMD laptops: the I2C controller and GPIO of the Ryzen chipsets
amdgpio_load="YES"
# Realtek card readers (RTS5209/5227/5229/522A/525A: the SD reader of the Clevo NS50/70MU is an RTS522A), the Realtek Gigabit Ethernet (RTL8111/8168) and NVMe disks
rtsx_load="YES"
if_re_load="YES"
nvme_load="YES"
# Mac programs: the kernel hands Mach-O files to machrun (rc script wsbsd_machrun)
imgact_binmisc_load="YES"
