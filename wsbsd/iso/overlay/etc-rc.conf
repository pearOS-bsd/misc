hostname="macbsd.local"
rc_startmsgs="NO"
devmatch_blocklist="uhid"
tmpmfs="YES"
varmfs="YES"
sendmail_enable="NONE"
sshd_enable="NO"
macdesktop_enable="YES"
airportd_enable="YES"
ldconfig_paths="/lib /usr/lib /usr/lib/compat /usr/local/lib /usr/local/GNUstep/System/Library/Libraries /usr/local/GNUstep/Local/Library/Libraries /System/Library/Frameworks/CoreWLAN.framework/Versions/A /System/Library/PrivateFrameworks/CoreWiFi.framework/Versions/A"
usernoted_enable="YES"
wsbsd_wifi_enable="YES"
wsbsd_overlay_enable="YES"
wsbsd_kbdlight_enable="YES"
rcshutdown_timeout="20"       # a stop script that hangs must not keep the machine at the tty: after 20 s rc.shutdown gives up on it and the shutdown goes on (FreeBSD rc.shutdown watchdog)
wsbsd_ssh_enable="YES"       # starts sshd only if the EFI partition holds ssh.enable (see rc.d/wsbsd_ssh)
ifconfig_DEFAULT="DHCP"       # wired interfaces get an address
wsbsd_bluetooth_enable="YES"
usbmuxd_enable="YES"          # pairing daemon for the iPhone (USB tethering through ipheth), from the usbmuxd package
hcsecd_enable="NO"            # started by the bluetooth service per controller
devmatch_enable="YES"          # loads the driver of any PCI / USB device that has one but is not in loader.conf (other Wi-Fi cards, dongles)
wsbsd_gpu_enable="YES"           # native GPU driver (drm-kmod: Intel, AMD) before the window server; EFISYS:/nogpu turns it off
defaultroute_delay="0"        # rc.d/defaultroute waited 30 s for a default route (no cable, Wi-Fi comes later through wpa_supplicant): the boot does not wait for the network
background_dhclient="YES"     # the DHCP clients ask in the background, the boot goes on
synchronous_dhclient="NO"
varsize="512m"
