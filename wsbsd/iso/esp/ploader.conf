# Ploader (pearOS-archlinux/pearos-bootloader) on this image: it boots the first operating system it finds without drawing anything (see its README); the boot menu is Alt+M.
# Every disk is scanned (a virtual machine shows the image as an internal disk, and an image written to a stick may be listed after the laptop's own system), but the volume of this image ("EFISYS") is the default selection: with a timeout of 0 it is booted without a menu, whatever else is installed.
timeout 0
scanfor internal,external,optical
default_selection "EFISYS"
