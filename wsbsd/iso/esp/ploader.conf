# Ploader (pearOS-archlinux/pearos-bootloader) on this image: it boots the first operating system it finds without drawing anything (see its README); the boot menu is Alt+M.
# Only the external and optical disks are scanned and the volume this image was written to ("EFISYS") is preferred: with "internal" the first system found on a laptop is its own disk's (an installed pearOS boots and the stick looks "skipped").
timeout 0
scanfor external,optical
default_selection "EFISYS"
