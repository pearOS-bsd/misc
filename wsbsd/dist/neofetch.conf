# copy to ~/.config/neofetch/config.conf (neofetch reads no system-wide file); keeps the stock layout, WM info as on the Mac
print_info() {
    info title; info underline
    info "OS" distro; info "Host" model; info "Kernel" kernel; info "Uptime" uptime
    info "Packages" packages; info "Shell" shell; info "Resolution" resolution
    info "DE" de
    prin "WM" "Quartz Compositor"
    prin "WM Theme" "Blue (Dark)"
    info "Terminal" term; info "CPU" cpu; info "GPU" gpu; info "Memory" memory
    info cols
}
