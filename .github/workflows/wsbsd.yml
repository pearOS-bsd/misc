name: wsbsd

on:
  push:
    paths: ['wsbsd/**', '.github/workflows/wsbsd.yml']
  pull_request:
    paths: ['wsbsd/**', '.github/workflows/wsbsd.yml']
  workflow_dispatch:

jobs:
  # wsd under AddressSanitizer + UBSan, fuzzed with random and size-exact SkyLight requests (any sanitizer report or a dead server fails the job)
  fuzz:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Sanitizer build and fuzz
        run: |
          cd wsbsd
          SAN="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1"
          cc $SAN -std=c99 -D_DEFAULT_SOURCE -Iinclude -o wsd_asan src/compositor_sw.c src/blur.c src/server.c src/shadow.c src/region.c src/ipc.c src/evrec.c src/buffer.c src/sls_*.c src/bplist.c src/wsd.c -lm
          cc -std=c99 -D_DEFAULT_SOURCE -Iinclude -Itest -o fuzz_wsd test/fuzz_wsd.c src/ipc.c src/client.c src/compositor_sw.c src/region.c src/evrec.c src/buffer.c -lm
          export WS_SOCKET=/tmp/fuzz.sock
          ./wsd_asan -t -g 640x480 > wsd.log 2>&1 &
          sleep 1
          for s in 1 2 3 4 5 6; do ./fuzz_wsd 100000 $s; done
          cc -std=c99 -D_DEFAULT_SOURCE -Iinclude -o scen_wsd lab/scen_wsd.c src/client.c src/compositor_sw.c src/region.c src/ipc.c src/evrec.c src/buffer.c -lm
          for f in lab/state1 lab/state2 lab/state3 lab/state4 lab/wq1 lab/wq2 lab/prop1 lab/harvest1 lab/harvest2 lab/harvest3 lab/harvest4 lab/hotkeys lab/disp1 lab/app1; do SCEN_MUTATE=300 ./scen_wsd $f.scen > /dev/null || { echo "mutation run failed on $f"; exit 1; }; done
          kill -0 $! && echo "wsd alive"
          if grep -q "runtime error\|AddressSanitizer" wsd.log; then cat wsd.log; exit 1; fi

  # The real target: FreeBSD on x86_64 (QEMU). Runs the whole test suite and renders the test window with the software compositor.
  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and render on FreeBSD x86_64
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          arch: x86_64
          usesh: true
          prepare: |
            pkg install -y gmake pkgconf python3
          run: |
            set -e
            uname -a
            cd wsbsd
            gmake
            gmake check
            gmake demo OUT=freebsd-sw
            ls -l *.png *.ppm || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freebsd-screenshots
          path: wsbsd/*.png
          if-no-files-found: warn

  # The OpenGL ES compositor on FreeBSD with Mesa software rendering (EGL surfaceless): compiles the GL, GBM and EGL paths and runs them.
  # Experimental: the compositor has never run on a real EGL implementation, so a failure here is information, not a broken build.
  freebsd-gl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the GL compositor on FreeBSD x86_64
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          arch: x86_64
          usesh: true
          prepare: |
            pkg install -y gmake pkgconf python3 libdrm mesa-libs mesa-dri libglvnd
          run: |
            set -e
            cd wsbsd
            pkg-config --modversion egl gbm glesv2 libdrm || true
            gmake gl
            export LIBGL_ALWAYS_SOFTWARE=1 EGL_PLATFORM=surfaceless
            WSD_ARGS="-r gl" OUT=freebsd-gl sh test/run_demo.sh
            WSD_ARGS="-r gl" OUT=freebsd-gl-interactive sh test/run_interactive.sh
            for f in freebsd-gl-interactive-*.ppm; do python3 tools/ppm2png.py "$f" "${f%.ppm}.png" || true; done
            ls -l *.png *.ppm || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freebsd-gl-screenshots
          path: wsbsd/*.png
          if-no-files-found: warn

  # The development machine's platform (arm64 macOS): the same suite, headless.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and render
        run: |
          cd wsbsd
          make
          make check
          make demo OUT=macos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-screenshots
          path: wsbsd/*.png
          if-no-files-found: warn

  # CoreGraphics above wsd: GNUstep corebase + Opal (Quartz 2D over Cairo) built from source on FreeBSD, drawing into a wsd window.
  freebsd-opal:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build Opal and run the CoreGraphics demo on FreeBSD x86_64
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          arch: x86_64
          usesh: true
          run: |
            pkg install -y python3 >/dev/null 2>&1
            sh wsbsd/ci/opal-build.sh 2>&1 | tail -30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freebsd-opal-screenshot
          path: |
            wsbsd/opal.png
            wsbsd/opal-click.png
          if-no-files-found: warn

  # AppKit above wsd: GNUstep gui with the wsd display backend (appkit/back-wsd), an AppKit window on the real compositor.
  freebsd-appkit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build libs-back with the wsd server and run an AppKit program
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          arch: x86_64
          usesh: true
          run: |
            sh wsbsd/ci/gnustep-wsd.sh 2>&1 | tail -60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freebsd-appkit-screenshot
          path: |
            wsbsd/appkit.png
            wsbsd/appkit-click.png
            wsbsd/appkit-key.png
            wsbsd/appkit-drag.png
            wsbsd/appkit-resize.png
            wsbsd/sudoku.png
            wsbsd/sudoku-cell.png
            wsbsd/sudoku-menu.png
            wsbsd/gorm.png
            wsbsd/gorm-menu.png
            wsbsd/gorm-doc.png
          if-no-files-found: warn

  # Core Animation: GNUstep QuartzCore (CALayer) over Opal on FreeBSD. Exploratory: the build is expected to need patches.
  freebsd-quartzcore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build GNUstep QuartzCore
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          arch: x86_64
          usesh: true
          run: |
            sh wsbsd/ci/quartzcore-build.sh 2>&1 | tail -70
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freebsd-quartzcore-screenshots
          path: |
            wsbsd/ca-a.png
            wsbsd/ca-b.png
          if-no-files-found: warn
