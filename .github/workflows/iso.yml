name: iso

# A bootable FreeBSD image with the macOS file layout that starts the window server by itself. Built on demand (the everyday image is built locally) and published as the release `iso-latest`;
# a tag `v*` makes a release of its own.
on:
  # no push trigger: the image is built locally (wsbsd/iso/build.sh in the dev VM, run in QEMU); this runs on demand or for a release tag
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      arm:
        description: 'Also build the arm64 image (slow); false = amd64 only'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ploader (a rEFInd fork, GPL; the source is in wsbsd/ploader, with the pear in place of the BSD logo): built on Linux with gnu-efi, for x86_64 and (cross-compiled) aarch64
  ploader:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.arch == 'aarch64' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.event.inputs.arm == 'false' && '["x86_64"]' || '["x86_64","aarch64"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Ploader
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git
          X=x64; CROSS=""
          if [ "${{ matrix.arch }}" = aarch64 ]; then sudo apt-get install -y -qq gcc-aarch64-linux-gnu; X=aa64; CROSS="CROSS_COMPILE=aarch64-linux-gnu-"; fi
          # Ploader's sources are written against gnu-efi 4 (AsciiStrLen); Ubuntu's package is 3.0
          git clone --depth 1 --branch 4.0.4 https://github.com/ncroxon/gnu-efi ge
          make -C ge -j4 ARCH=${{ matrix.arch }} $CROSS > ge.log 2>&1 || { tail -30 ge.log; exit 1; }
          make -C ge install ARCH=${{ matrix.arch }} $CROSS PREFIX=/usr INSTALLROOT="$PWD/geroot" > ge-install.log 2>&1 || { tail -30 ge-install.log; exit 1; }
          cd wsbsd/ploader
          GE="$GITHUB_WORKSPACE/geroot/usr"; EFIH=$(find "$GE" -name efi.h -path '*/efi/efi.h' | head -1)
          echo "efi.h: $EFIH"
          LIBD="$GE/lib"; [ -f "$LIBD/crt0-efi-${{ matrix.arch }}.o" ] || LIBD=$(dirname "$(find "$GE" -name 'crt0-efi-${{ matrix.arch }}.o' | head -1)")
          echo "libs: $LIBD"
          EFIINC=$(dirname "$EFIH")
          make ARCH=${{ matrix.arch }} $CROSS EFIINC="$EFIINC" GNUEFILIB="$LIBD" EFILIB="$LIBD" EFICRT0="$LIBD" 2>&1 | tail -15
          ls -l ploader/*.efi
          mkdir -p ../../ploader-out
          cp ploader/ploader_$X.efi ../../ploader-out/
          cp -R theme ../../ploader-out/theme
      - uses: actions/upload-artifact@v4
        with:
          name: ploader-${{ matrix.arch }}
          path: ploader-out
          if-no-files-found: error

  iso:
    needs: ploader
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    continue-on-error: ${{ matrix.arch == 'aarch64' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.event.inputs.arm == 'false' && '["x86_64"]' || '["x86_64","aarch64"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ploader-${{ matrix.arch }}
          path: ploader-out
      - name: Build the image on FreeBSD ${{ matrix.arch }}
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          arch: ${{ matrix.arch }}
          usesh: true
          mem: 6144
          prepare: |
            pkg install -y python3 gmake pkgconf git >/dev/null 2>&1
          run: |
            set -e
            cd "$GITHUB_WORKSPACE" 2>/dev/null || true
            PLOADER_DIR="$PWD/ploader-out" OUT="$PWD/wsbsd/iso-out" sh wsbsd/iso/build.sh
            # the ISO is also the disk image for a USB stick (hybrid GPT, iso/tools/hybrid.py): nothing else is built or published
            rm -rf /tmp/isowork/root /tmp/isowork/rootfs.img /tmp/isowork/esp /tmp/isowork/gnustep* 2>/dev/null
            # the release names the two builds amd64 and arm64
            for f in wsbsd/iso-out/macbsd-aarch64*; do [ -e "$f" ] && mv "$f" "$(echo "$f" | sed 's/macbsd-aarch64/macbsd-arm64/')"; done
            for f in wsbsd/iso-out/macbsd-arm64*.sha256; do [ -e "$f" ] && sed -i '' 's/macbsd-aarch64/macbsd-arm64/' "$f"; done
            ls -l wsbsd/iso-out
            exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macbsd-iso-${{ matrix.arch }}
          path: |
            wsbsd/iso-out/*.iso
          if-no-files-found: warn

  # the image has to boot: both forms (the USB disk image and the ISO as a CD) are started in QEMU with UEFI firmware and the screen is looked at
  boot-test:
    needs: iso
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        form: [usb, cd, login]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macbsd-iso-x86_64
          path: out
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf xz-utils python3-pil socat
          ls /usr/share/OVMF/ || true
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; echo "KVM available"; else echo "no KVM: software emulation (slow)"; fi
      - name: Boot it
        run: |
          set -x
          CODE=$(ls /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd 2>/dev/null | head -1)
          VARS=$(ls /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd 2>/dev/null | head -1)
          cp "$VARS" vars.fd
          PROD=wsbsd-ci; [ "${{ matrix.form }}" = login ] && PROD=wsbsd-login       # login: the real path (login window, the password typed), the others sign in by themselves
          if [ "${{ matrix.form }}" = usb ]; then
            DRIVE="-drive if=none,id=u,file=out/macbsd-amd64.iso,format=raw,snapshot=on -device ich9-ahci,id=ahci -device ide-hd,drive=u,bus=ahci.0,bootindex=1 -device qemu-xhci"       # the disk image as a SATA disk: what is tested is the image (GPT, ESP, UFS root); the USB mass storage of QEMU under software emulation gave I/O errors on a large read (a real stick is not that emulation)
          else
            DRIVE="-drive if=none,id=c,file=out/macbsd-amd64.iso,format=raw,media=cdrom,readonly=on -device ide-cd,drive=c,bootindex=1 -device qemu-xhci"
          fi
          ACCEL="-accel tcg"; [ -w /dev/kvm ] && ACCEL="-accel kvm -cpu host"
          qemu-system-x86_64 $ACCEL -m 4096 -smp 2 -machine q35 -vga std -display none \
            -drive if=pflash,format=raw,readonly=on,file="$CODE" -drive if=pflash,format=raw,file=vars.fd \
            $DRIVE -device usb-kbd -device usb-tablet -smbios type=1,product=$PROD -monitor unix:/tmp/mon,server,nowait -serial file:serial.log -daemonize
          mkdir -p shots
          ok=0
          for i in $(seq 1 80); do
            sleep 15
            if [ "${{ matrix.form }}" = login ] && [ $((i % 3)) -eq 0 ]; then for k in p e a r ret; do echo "sendkey $k" | socat - UNIX-CONNECT:/tmp/mon >/dev/null 2>&1; sleep 0.3; done; fi       # the password of the image's account (alex / pear): typed every 45 s until the desktop is there
            echo "screendump /tmp/s.ppm" | socat - UNIX-CONNECT:/tmp/mon >/dev/null 2>&1 || true; sleep 2
            if python3 wsbsd/iso/tools/screen_check.py /tmp/s.ppm /tmp/last.png desktop
            then ok=1; cp /tmp/last.png shots/desktop.png; break; fi
            [ $((i % 4)) -eq 0 ] && cp /tmp/last.png shots/progress-$i.png 2>/dev/null || true
          done
          # a scenario on the booted desktop: type `ps aux` and `ls /` in the Terminal and look at the screen (the keys go through the QEMU monitor), so that the behaviour of the image itself can be seen in the artifacts
          if [ $ok = 1 ]; then
            for cmd in "p s spc a u x ret" "l s spc slash ret"; do
              for k in $cmd; do echo "sendkey $k" | socat - UNIX-CONNECT:/tmp/mon >/dev/null 2>&1; sleep 0.25; done; sleep 6
            done
            echo "screendump /tmp/s2.ppm" | socat - UNIX-CONNECT:/tmp/mon >/dev/null 2>&1; sleep 2
            python3 -c "from PIL import Image; Image.open('/tmp/s2.ppm').save('shots/after-ps-aux.png')" || true
          fi
          sleep 20
          echo "screendump /tmp/s.ppm" | socat - UNIX-CONNECT:/tmp/mon >/dev/null 2>&1 || true
          python3 -c "from PIL import Image; Image.open('/tmp/s.ppm').save('shots/final.png')" || true
          tail -50 serial.log || true
          [ $ok = 1 ] || { echo "the image did not reach a desktop"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-${{ matrix.form }}
          path: |
            shots
            serial.log
          if-no-files-found: warn

  # the arm64 ISO under QEMU (TCG, slow: FreeBSD arm64 and the desktop on an emulated CPU); informational, never blocks the release
  boot-test-arm64:
    if: ${{ github.event.inputs.arm != 'false' }}
    needs: iso
    runs-on: ubuntu-latest
    timeout-minutes: 150
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        form: [cd, usb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macbsd-iso-aarch64
          path: out
      - name: Install QEMU and AAVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm qemu-efi-aarch64 python3-pil socat xz-utils
          ls /usr/share/AAVMF/ || true
      - name: Boot it
        run: |
          set -x
          cp /usr/share/AAVMF/AAVMF_VARS.fd vars.fd; truncate -s 64M vars.fd; cp /usr/share/AAVMF/AAVMF_CODE.fd code.fd; truncate -s 64M code.fd
          if [ "${{ matrix.form }}" = usb ]; then
            DRIVE="-drive if=none,id=u,file=out/macbsd-arm64.iso,format=raw,snapshot=on -device scsi-hd,drive=u,bootindex=1"
          else
            DRIVE="-drive if=none,id=c,file=out/macbsd-arm64.iso,format=raw,media=cdrom,readonly=on -device scsi-cd,drive=c,bootindex=1"
          fi
          qemu-system-aarch64 -M virt,gic-version=max -cpu max -accel tcg,thread=multi -m 4096 -smp 4 -display none -device ramfb \
            -drive if=pflash,format=raw,readonly=on,file=code.fd -drive if=pflash,format=raw,file=vars.fd \
            -device virtio-scsi-pci,id=scsi $DRIVE \
            -device qemu-xhci -device usb-kbd -device usb-tablet -smbios type=1,product=wsbsd-ci -monitor unix:/tmp/mon,server,nowait -serial file:serial.log -daemonize
          mkdir -p shots
          ok=0
          for i in $(seq 1 200); do
            sleep 20
            echo "screendump /tmp/s.ppm" | socat - UNIX-CONNECT:/tmp/mon >/dev/null 2>&1 || true; sleep 2
            if python3 wsbsd/iso/tools/screen_check.py /tmp/s.ppm /tmp/last.png
            then ok=1; cp /tmp/last.png shots/desktop.png; break; fi
            [ $((i % 6)) -eq 0 ] && cp /tmp/last.png shots/progress-$i.png 2>/dev/null || true
          done
          # a scenario on the booted desktop: type `ps aux` and `ls /` in the Terminal and look at the screen (the keys go through the QEMU monitor), so that the behaviour of the image itself can be seen in the artifacts
          if [ $ok = 1 ]; then
            for cmd in "p s spc a u x ret" "l s spc slash ret"; do
              for k in $cmd; do echo "sendkey $k" | socat - UNIX-CONNECT:/tmp/mon >/dev/null 2>&1; sleep 0.25; done; sleep 6
            done
            echo "screendump /tmp/s2.ppm" | socat - UNIX-CONNECT:/tmp/mon >/dev/null 2>&1; sleep 2
            python3 -c "from PIL import Image; Image.open('/tmp/s2.ppm').save('shots/after-ps-aux.png')" || true
          fi
          echo "screendump /tmp/s.ppm" | socat - UNIX-CONNECT:/tmp/mon >/dev/null 2>&1 || true
          python3 -c "from PIL import Image; Image.open('/tmp/s.ppm').save('shots/final.png')" || true
          tail -50 serial.log || true
          [ $ok = 1 ] || { echo "the arm64 image did not reach a desktop"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-arm64-${{ matrix.form }}
          path: |
            shots
            serial.log
          if-no-files-found: warn

  release:
    needs: iso
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: macbsd-iso-*
          merge-multiple: true
          path: out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l out
          TAG="iso-latest"; TITLE="macbsd image (latest build)"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then TAG="${GITHUB_REF_NAME}"; TITLE="macbsd ${GITHUB_REF_NAME}"; fi
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" out/*.iso --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --prerelease \
            --notes "Bootable UEFI images, nothing else to unpack: write the .iso straight to a USB stick (dd, balenaEtcher, Rufus in DD mode) or attach it to a virtual machine as a CD. amd64 is for an x86-64 PC with UEFI, arm64 for aarch64 UEFI machines and VMs; Secure Boot off. The boot loader is Ploader (source: wsbsd/ploader); the desktop is the wsbsd window server with the Dock, the menu bar and the Finder."
