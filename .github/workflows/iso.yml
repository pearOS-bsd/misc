name: iso

# A bootable FreeBSD image with the macOS file layout that starts the window server by itself. Built on demand (the everyday image is built locally) and published as the release `iso-latest`;
# a tag `v*` makes a release of its own.
on:
  # no push trigger: the image is built locally (wsbsd/iso/build.sh in the dev VM, run in QEMU); this runs on demand or for a release tag
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ploader (pearOS-archlinux/pearos-bootloader, a rEFInd fork, GPL): built on Linux with gnu-efi
  ploader:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Build Ploader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git
          # Ploader's sources are written against gnu-efi 4 (AsciiStrLen); Ubuntu's package is 3.0
          git clone --depth 1 --branch 4.0.4 https://github.com/ncroxon/gnu-efi ge
          make -C ge -j4 > ge.log 2>&1 || { tail -30 ge.log; exit 1; }
          make -C ge install PREFIX=/usr INSTALLROOT="$PWD/geroot" > ge-install.log 2>&1 || { tail -30 ge-install.log; exit 1; }
          find geroot -name efi.h -o -name 'crt0-efi-x86_64.o' -o -name 'elf_x86_64_efi.lds' -o -name 'libgnuefi.a' | head
          git clone --depth 1 https://github.com/pearOS-archlinux/pearos-bootloader pb
          cd pb
          GE="$PWD/../geroot/usr"; EFIH=$(find "$GE" -name efi.h -path '*/efi/efi.h' | head -1)
          echo "efi.h: $EFIH"
          LIBD="$GE/lib"; [ -f "$LIBD/crt0-efi-x86_64.o" ] || LIBD=$(dirname "$(find "$GE" -name 'crt0-efi-x86_64.o' | head -1)")
          echo "libs: $LIBD"
          EFIINC=$(dirname "$EFIH")
          make EFIINC="$EFIINC" GNUEFILIB="$LIBD" EFILIB="$LIBD" EFICRT0="$LIBD" 2>&1 | tail -15
          ls -l ploader/*.efi
          mkdir -p ../ploader-out/licenses
          cp ploader/ploader_x64.efi ../ploader-out/
          cp -R theme ../ploader-out/theme
          cp COPYING.txt LICENSE.txt CREDITS.txt README.md ../ploader-out/licenses/
          git rev-parse HEAD > ../ploader-out/licenses/SOURCE-COMMIT.txt
          echo "Source: https://github.com/pearOS-archlinux/pearos-bootloader" >> ../ploader-out/licenses/SOURCE-COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ploader
          path: ploader-out
          if-no-files-found: error

  iso:
    needs: ploader
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ploader
          path: ploader-out
      - name: Build the image on FreeBSD x86_64
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          arch: x86_64
          usesh: true
          mem: 6144
          prepare: |
            pkg install -y python3 gmake pkgconf git >/dev/null 2>&1
          run: |
            set -e
            cd "$GITHUB_WORKSPACE" 2>/dev/null || true
            PLOADER_DIR="$PWD/ploader-out" OUT="$PWD/wsbsd/iso-out" sh wsbsd/iso/build.sh
            # the disk image for a USB stick (a plain `dd` of the ISO is not bootable on a PC: no partition table with an EFI system partition, and the loader reads /boot from the FAT partition it starts from):
            # GPT { EFI system partition with Ploader and the whole /boot, the ISO itself }; written with xz so that it fits the 2 GB of a release asset
            rm -rf /tmp/isowork/root /tmp/isowork/esp /tmp/isowork/gnustep* 2>/dev/null || true
            # the USB image must never stop the ISO from being published: every step below is allowed to fail (the disk is shown when it does)
            set +e
            sh wsbsd/iso/tools/mkusb.sh "$PWD/wsbsd/iso-out/macbsd-amd64.iso" "$PWD/wsbsd/iso-out/macbsd-amd64-usb.img" || df -h
            if [ -f wsbsd/iso-out/macbsd-amd64-usb.img ]; then
              xz -T0 -3 "$PWD/wsbsd/iso-out/macbsd-amd64-usb.img" || { echo "xz failed"; df -h; rm -f wsbsd/iso-out/macbsd-amd64-usb.img wsbsd/iso-out/macbsd-amd64-usb.img.xz; }
              [ -f wsbsd/iso-out/macbsd-amd64-usb.img.xz ] && (cd wsbsd/iso-out && sha256 macbsd-amd64-usb.img.xz > macbsd-amd64-usb.img.xz.sha256)
            fi
            ls -l wsbsd/iso-out
            exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macbsd-iso
          path: |
            wsbsd/iso-out/*.iso
            wsbsd/iso-out/*.img.xz
            wsbsd/iso-out/*.sha256
          if-no-files-found: warn

  # the image has to boot: both forms (the USB disk image and the ISO as a CD) are started in QEMU with UEFI firmware and the screen is looked at
  boot-test:
    needs: iso
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        form: [usb, cd]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macbsd-iso
          path: out
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf xz-utils python3-pil socat
          ls /usr/share/OVMF/ || true
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; echo "KVM available"; else echo "no KVM: software emulation (slow)"; fi
      - name: Boot it
        run: |
          set -x
          CODE=$(ls /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd 2>/dev/null | head -1)
          VARS=$(ls /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd 2>/dev/null | head -1)
          cp "$VARS" vars.fd
          if [ "${{ matrix.form }}" = usb ]; then
            xz -dk out/macbsd-amd64-usb.img.xz; DRIVE="-device qemu-xhci -drive if=none,id=u,file=out/macbsd-amd64-usb.img,format=raw,snapshot=on -device usb-storage,drive=u,bootindex=1"
          else
            DRIVE="-drive if=none,id=c,file=out/macbsd-amd64.iso,format=raw,media=cdrom,readonly=on -device ide-cd,drive=c,bootindex=1 -device qemu-xhci"
          fi
          ACCEL="-accel tcg"; [ -w /dev/kvm ] && ACCEL="-accel kvm -cpu host"
          qemu-system-x86_64 $ACCEL -m 4096 -smp 2 -machine q35 -vga std -display none \
            -drive if=pflash,format=raw,readonly=on,file="$CODE" -drive if=pflash,format=raw,file=vars.fd \
            $DRIVE -device usb-kbd -device usb-tablet -monitor unix:/tmp/mon,server,nowait -serial file:serial.log -daemonize
          mkdir -p shots
          ok=0
          for i in $(seq 1 80); do
            sleep 15
            echo "screendump /tmp/s.ppm" | socat - UNIX-CONNECT:/tmp/mon >/dev/null 2>&1 || true; sleep 2
            if python3 wsbsd/iso/tools/screen_check.py /tmp/s.ppm /tmp/last.png
            then ok=1; cp /tmp/last.png shots/desktop.png; break; fi
            [ $((i % 4)) -eq 0 ] && cp /tmp/last.png shots/progress-$i.png 2>/dev/null || true
          done
          sleep 20
          echo "screendump /tmp/s.ppm" | socat - UNIX-CONNECT:/tmp/mon >/dev/null 2>&1 || true
          python3 -c "from PIL import Image; Image.open('/tmp/s.ppm').save('shots/final.png')" || true
          tail -50 serial.log || true
          [ $ok = 1 ] || { echo "the image did not reach a desktop"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-${{ matrix.form }}
          path: |
            shots
            serial.log
          if-no-files-found: warn

  release:
    needs: iso
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macbsd-iso
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: ploader
          path: ploader-out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l out
          TAG="iso-latest"; TITLE="macbsd image (latest build)"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then TAG="${GITHUB_REF_NAME}"; TITLE="macbsd ${GITHUB_REF_NAME}"; fi
          tar -czf out/ploader-licenses.tar.gz -C ploader-out licenses
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --prerelease \
            --notes "Bootable UEFI image (amd64, x86-64 PC with UEFI; Secure Boot off): Ploader, FreeBSD without boot screens, the macOS file layout (real files, no symlinks), the wsbsd window server on the framebuffer with the Dock, the menu bar (Control Center, Spotlight, Notification Center), the desktop (Finder) and Terminal. FOR A REAL PC use macbsd-amd64-usb.img.xz: write it to a USB stick (balenaEtcher or Rufus open .xz directly; on Linux/macOS: xz -dc macbsd-amd64-usb.img.xz | sudo dd of=/dev/sdX bs=4M status=progress) and boot the stick in UEFI mode. A plain dd of the .iso to a stick is NOT bootable on a PC (the .iso is for virtual machines and optical media). Both forms were started in QEMU with UEFI firmware by the workflow before this release. Built from commit $GITHUB_SHA. Ploader is GPL (licence files in ploader-licenses.tar.gz, source: https://github.com/pearOS-archlinux/pearos-bootloader)."
